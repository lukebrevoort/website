<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MALCOM hand-drawn architecture sketch</title>
  <desc id="desc">A simple wireframe diagram showing Hermes feeding MALCOM, which coordinates coding harnesses, integrations, and a remote Mac runtime.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11" fill="none" stroke="#1e1e2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="12" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="1 0 0 0 .9  0 1 0 0 .88  0 0 1 0 .8  0 0 0 .06 0"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#fffdf6"/>
  <rect width="1600" height="900" filter="url(#paper)" opacity=".35"/>
  <g font-family="Comic Sans MS, Chalkboard SE, Marker Felt, cursive" fill="#1e1e2e">
    <text x="90" y="108" font-size="42" font-weight="700">MALCOM — how it fits together</text>
    <text x="93" y="153" font-size="23" fill="#5b5569">a small sketch of the remote agent setup</text>

    <!-- Hermes -->
    <g transform="rotate(-1 255 372)">
      <path d="M104 272 C104 258 118 252 132 253 L381 254 C397 254 405 263 404 278 L401 444 C401 459 390 466 376 465 L126 462 C111 462 102 452 104 437 Z" fill="#fff3bf" stroke="#1e1e2e" stroke-width="4" stroke-linejoin="round"/>
      <path d="M109 276 C109 264 119 258 132 258 L377 259" fill="none" stroke="#1e1e2e" stroke-width="2" opacity=".75"/>
      <text x="145" y="324" font-size="23" font-weight="700" fill="#8a5a00">CONVERSATION</text>
      <text x="145" y="385" font-size="49" font-weight="700">Hermes</text>
      <text x="145" y="423" font-size="22">figures out the work</text>
    </g>

    <!-- MALCOM -->
    <g transform="rotate(.6 770 371)">
      <path d="M531 243 C531 225 547 216 565 218 L974 218 C991 218 1002 232 1000 248 L1004 496 C1004 514 991 524 974 522 L550 524 C534 524 523 512 526 496 Z" fill="#d9f7ee" stroke="#1e1e2e" stroke-width="5" stroke-linejoin="round"/>
      <path d="M537 247 C538 232 550 226 566 227 L970 226 C985 226 993 237 992 252" fill="none" stroke="#1e1e2e" stroke-width="2" opacity=".75"/>
      <text x="580" y="285" font-size="23" font-weight="700" fill="#0e715d">CONTROLLER</text>
      <text x="580" y="366" font-size="70" font-weight="800">MALCOM</text>
      <path d="M580 390 C684 386 824 389 945 390" fill="none" stroke="#1e1e2e" stroke-width="3" stroke-linecap="round"/>
      <text x="580" y="434" font-size="24">sessions · workspaces · policy</text>
      <text x="580" y="472" font-size="24">logs · artifacts · handoffs</text>
    </g>

    <!-- Harnesses -->
    <g transform="rotate(-.8 1290 300)">
      <path d="M1114 205 C1114 190 1127 184 1141 185 L1475 188 C1490 188 1498 198 1497 212 L1492 380 C1492 393 1482 400 1469 399 L1128 396 C1114 396 1107 386 1109 371 Z" fill="#e8e6ff" stroke="#1e1e2e" stroke-width="4" stroke-linejoin="round"/>
      <text x="1154" y="246" font-size="21" font-weight="700" fill="#5742a8">CODING HARNESSES</text>
      <text x="1154" y="301" font-size="32" font-weight="700">Codex · OpenCode</text>
      <text x="1154" y="345" font-size="32" font-weight="700">Cursor · shell</text>
    </g>

    <!-- Integrations -->
    <g transform="rotate(.9 1290 563)">
      <path d="M1110 487 C1110 473 1120 466 1135 467 L1470 470 C1484 470 1491 480 1490 494 L1493 656 C1493 670 1482 678 1469 677 L1126 675 C1111 675 1104 664 1106 650 Z" fill="#ffe4ed" stroke="#1e1e2e" stroke-width="4" stroke-linejoin="round"/>
      <text x="1152" y="528" font-size="21" font-weight="700" fill="#a33760">INTEGRATIONS</text>
      <text x="1152" y="583" font-size="32" font-weight="700">GitHub · Notion</text>
      <text x="1152" y="627" font-size="32" font-weight="700">Linear · Gmail</text>
    </g>

    <!-- Runtime -->
    <g transform="rotate(-.5 765 736)">
      <path d="M520 663 C520 647 534 639 549 640 L997 642 C1012 642 1021 653 1019 668 L1015 811 C1015 826 1004 833 990 832 L541 830 C527 830 518 819 519 805 Z" fill="#dcecff" stroke="#1e1e2e" stroke-width="4" stroke-linejoin="round"/>
      <text x="569" y="705" font-size="21" font-weight="700" fill="#306aa7">REMOTE MAC</text>
      <text x="569" y="758" font-size="30" font-weight="700">worktrees · tmux sessions</text>
      <text x="569" y="796" font-size="24">where the actual work runs</text>
    </g>

    <!-- hand-drawn arrows -->
    <path d="M412 357 C451 350 475 347 518 356" fill="none" stroke="#1e1e2e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1009 335 C1044 311 1064 296 1101 292" fill="none" stroke="#1e1e2e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1009 444 C1053 489 1068 539 1100 562" fill="none" stroke="#1e1e2e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M770 536 C768 579 767 605 769 638" fill="none" stroke="#1e1e2e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

    <!-- annotations -->
    <text x="414" y="323" font-size="20" fill="#5b5569" transform="rotate(-7 414 323)">requests</text>
    <text x="1012" y="277" font-size="20" fill="#5b5569" transform="rotate(-7 1012 277)">starts + tracks</text>
    <text x="1027" y="517" font-size="20" fill="#5b5569" transform="rotate(7 1027 517)">adapters</text>
    <text x="790" y="602" font-size="20" fill="#5b5569" transform="rotate(4 790 602)">executes</text>

    <path d="M92 858 C257 852 414 858 570 854" fill="none" stroke="#1e1e2e" stroke-width="2" stroke-linecap="round"/>
    <text x="92" y="837" font-size="19" fill="#5b5569">Simple on purpose: MALCOM owns execution state, not the conversation.</text>
  </g>
</svg>
